name: Publish macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish, e.g. v0.1.0
        required: true
        type: string
      release_name:
        description: Optional release title
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            name="${{ inputs.release_name }}"
            prerelease="${{ inputs.prerelease }}"
          else
            tag="${GITHUB_REF_NAME}"
            name=""
            prerelease="false"
          fi

          if [[ -z "${name}" ]]; then
            name="Privacy Filter ${tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Validate release secrets
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()

          for name in \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            printf '\nThis workflow publishes signed macOS release assets. GitHub source archives are not app installers.\n' >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare App Store Connect key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_PRIVATE_KEY}" > "${key_path}"
          echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Import Apple signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="${RUNNER_TEMP}/build.keychain-db"
          cert_path="${RUNNER_TEMP}/apple-signing-cert.p12"
          keychain_password="$(openssl rand -base64 24)"

          echo "${APPLE_CERTIFICATE}" | base64 --decode > "${cert_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain-db
          security default-keychain -d user -s "${keychain_path}"

      - name: Detect signing identity
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          identity="${APPLE_SIGNING_IDENTITY}"

          if [[ -z "${identity}" ]]; then
            identity="$(security find-identity -v -p codesigning | sed -n 's/.*\"\\(.*\\)\"/\\1/p' | head -n 1)"
          fi

          if [[ -z "${identity}" ]]; then
            echo "Unable to detect a signing identity after importing the certificate." >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=${identity}" >> "${GITHUB_ENV}"

      - name: Build signed release artifacts
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          OGRAM_RELEASE_NOTES: Privacy Filter by ogram ${{ steps.release.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:mac:all

      - name: Verify DMG notarization
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"

          if [[ -z "${dmg_path}" ]]; then
            echo "No DMG artifact found after release build." >&2
            exit 1
          fi

          spctl -a -vv -t install "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

      - name: Create stable macOS download alias
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' ! -name 'Privacy-Filter-macOS.dmg' | head -n 1)"

          if [[ -z "${dmg_path}" ]]; then
            echo "No DMG artifact found for stable download alias." >&2
            exit 1
          fi

          cp "${dmg_path}" src-tauri/target/release/bundle/dmg/Privacy-Filter-macOS.dmg

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          name="${{ steps.release.outputs.name }}"
          prerelease_flag=""

          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "${tag}" > /dev/null 2>&1; then
            gh release edit "${tag}" --title "${name}" ${prerelease_flag}
          else
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "${name}" \
              --generate-notes \
              ${prerelease_flag}
          fi

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig \
            src-tauri/target/release/bundle/updater/latest.json \
            --clobber
