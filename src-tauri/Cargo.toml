[package]
name = "ogram-private-desktop"
version = "0.1.2"
description = "Privacy Filter by ogram is a local-first desktop redaction utility for privacy-sensitive workflows."
authors = ["ogram"]
license = "MIT"
repository = "https://github.com/self-tech-labs/privacy-filter"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ogram_private_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
office_oxide = "0.1.0"
pdf-extract = "0.10.0"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
